version: '3.8'

# ================================================================================
# Sec-Llama - Production Docker Compose Configuration
# ================================================================================
#
# Quick Start:
#   1. cp .env.example .env
#   2. Edit .env (set passwords, OLLAMA_HOST, SECRET_KEY, JWT_SECRET_KEY)
#   3. docker-compose up -d
#   4. Open http://localhost:8080
#
# Management Commands:
#   Start:   docker-compose up -d
#   Stop:    docker-compose down
#   Logs:    docker-compose logs -f
#   Restart: docker-compose restart
#   Status:  docker-compose ps
#
# ================================================================================

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: sec-llama-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sec_llama}
      POSTGRES_USER: ${POSTGRES_USER:-sec_llama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # For manual backups

    networks:
      - sec-llama-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sec_llama} -d ${POSTGRES_DB:-sec_llama}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: ${RESTART_POLICY:-unless-stopped}

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Security options
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem (data in volumes)
    read_only: false  # PostgreSQL needs writable /var/run

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: sec-llama-redis

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --save 900 1
      --save 300 10
      --save 60 10000

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    networks:
      - sec-llama-network

    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-secllama}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: ${RESTART_POLICY:-unless-stopped}

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Web UI Application
  # ============================================================================
  web-ui:
    build:
      context: ./implementations/lan-server
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
      # Build cache (speeds up rebuilds)
      cache_from:
        - sec-llama/web-ui:latest

    image: sec-llama/web-ui:latest
    container_name: sec-llama-web-ui

    environment:
      # ===== DATABASE =====
      DATABASE_URL: postgresql://${POSTGRES_USER:-sec_llama}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sec_llama}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-sec_llama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sec_llama}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-20}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10}

      # ===== REDIS =====
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}

      # ===== LLM PROVIDER =====
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:?OLLAMA_HOST must be set in .env}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      LM_STUDIO_HOST: ${LM_STUDIO_HOST:-http://192.168.1.100:1234}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-not-needed}

      # ===== SECURITY =====
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ACCESS_TOKEN_EXPIRE: ${JWT_ACCESS_TOKEN_EXPIRE:-3600}
      JWT_REFRESH_TOKEN_EXPIRE: ${JWT_REFRESH_TOKEN_EXPIRE:-604800}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

      # ===== ADMIN USER =====
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sec-llama.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}

      # ===== APPLICATION =====
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_UI_PORT: 8080
      UVICORN_WORKERS: ${UVICORN_WORKERS:-auto}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-3}

      # ===== CORS =====
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}

      # ===== RATE LIMITING =====
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-60}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_TOOLS: ${RATE_LIMIT_TOOLS:-30}

      # ===== SESSION =====
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-3600}
      SESSION_BACKEND: ${SESSION_BACKEND:-redis}

      # ===== FILES & UPLOADS =====
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-100}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.py,.js,.java,.php,.go,.rb,.c,.cpp,.cs,.pcap,.cap,.log,.txt,.yaml,.yml,.json,.xml}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}

      # ===== REPORTS =====
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-90}
      REPORT_FORMATS: ${REPORT_FORMATS:-pdf,html,json}

      # ===== BACKUP =====
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}

      # ===== SCANNING =====
      NMAP_PATH: ${NMAP_PATH:-/usr/bin/nmap}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-300}
      MAX_HOSTS_PER_SCAN: ${MAX_HOSTS_PER_SCAN:-255}
      DEFAULT_SCAN_PROFILE: ${DEFAULT_SCAN_PROFILE:-standard}

      # ===== FEATURE FLAGS =====
      FEATURE_NETWORK_SCANNING: ${FEATURE_NETWORK_SCANNING:-true}
      FEATURE_CODE_SCANNING: ${FEATURE_CODE_SCANNING:-true}
      FEATURE_CVE_LOOKUP: ${FEATURE_CVE_LOOKUP:-true}
      FEATURE_WIRELESS_AUDIT: ${FEATURE_WIRELESS_AUDIT:-true}
      FEATURE_CONTAINER_SECURITY: ${FEATURE_CONTAINER_SECURITY:-true}
      FEATURE_API_FUZZING: ${FEATURE_API_FUZZING:-true}
      FEATURE_LOG_ANALYSIS: ${FEATURE_LOG_ANALYSIS:-true}
      FEATURE_THREAT_INTEL: ${FEATURE_THREAT_INTEL:-true}

      # ===== TIMEZONE =====
      TZ: ${TZ:-Europe/Rome}

      # ===== MONITORING =====
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: ${METRICS_PORT:-9090}

      # ===== API DOCS =====
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SWAGGER_UI_PATH: ${SWAGGER_UI_PATH:-/docs}
      REDOC_PATH: ${REDOC_PATH:-/redoc}

    ports:
      - "${WEB_UI_PORT:-8080}:8080"
      # Metrics port (if enabled)
      - "${METRICS_PORT:-9090}:9090"

    volumes:
      # Persistent data
      - ./data/logs:/app/logs
      - ./data/reports:/app/reports
      - ./data/database:/app/database
      - ./data/uploads:/app/uploads
      - ./data/backups:/app/backups

      # Config (read-only)
      - ./implementations/lan-server/config:/app/config:ro

    networks:
      - sec-llama-network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: ${RESTART_POLICY:-unless-stopped}

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    # Run as non-root user (defined in Dockerfile)
    user: "1000:1000"

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  postgres_data:
    driver: local
    name: sec-llama-postgres-data

  redis_data:
    driver: local
    name: sec-llama-redis-data

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  sec-llama-network:
    driver: bridge
    name: sec-llama-network
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}
          gateway: 172.28.0.1
    driver_opts:
      com.docker.network.bridge.name: sec-llama0
      com.docker.network.driver.mtu: 1500
