version: '3.8'

services:
  # Sec-Llama Web UI
  sec-llama-web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web-ui
    container_name: sec-llama-web-ui
    ports:
      - "8080:8080"  # Web UI port
    environment:
      # Ollama configuration (connects to MCP server's Ollama)
      - OLLAMA_HOST=http://ollama:11434

      # Optional: Custom configuration
      - LOG_LEVEL=INFO

    volumes:
      # Configuration (writable for Web UI)
      - ./config:/app/config

      # Persistent data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./database:/app/database

    networks:
      - sec-llama-network

    depends_on:
      ollama:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ollama LLM Server (shared with MCP server)
  ollama:
    image: ollama/ollama:latest
    container_name: sec-llama-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - sec-llama-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Sec-Llama MCP Server (can run alongside Web UI)
  sec-llama-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: sec-llama-mcp-server
    ports:
      - "8765:8765"  # MCP HTTP/SSE port
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MCP_API_KEYS=${MCP_API_KEYS:-}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./database:/app/database
    networks:
      - sec-llama-network
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - with-mcp  # Optional: only start with --profile with-mcp

networks:
  sec-llama-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  ollama-models:
    name: sec-llama-ollama-models
