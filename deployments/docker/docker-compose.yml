version: '3.8'

services:
  sec-llama:
    build: .
    container_name: sec-llama-suite
    network_mode: host  # Required for network scanning
    privileged: true    # Required for packet capture
    volumes:
      - ./config:/app/config
      - ./reports:/app/reports
      - ./database:/app/database
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker scanning
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
    stdin_open: true
    tty: true
    command: --help

  # Optional: Run Ollama in container
  ollama:
    image: ollama/ollama:latest
    container_name: sec-llama-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
