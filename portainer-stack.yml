version: '3.8'

# ========================================
# Sec-Llama - Portainer Stack
# ========================================
#
# Deploy rapido su Portainer:
# 1. Portainer → Stacks → Add Stack
# 2. Nome: sec-llama
# 3. Upload questo file
# 4. Environment variables (vedi sotto)
# 5. Deploy!
#
# ENVIRONMENT VARIABLES OBBLIGATORIE:
# - OLLAMA_HOST=http://192.168.1.100:11434
# - POSTGRES_PASSWORD=password_sicura
# - REDIS_PASSWORD=redis_password
# - SECRET_KEY=chiave_32_caratteri
# - JWT_SECRET_KEY=jwt_key_32_caratteri
# - ADMIN_PASSWORD=password_admin
#

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sec_llama}
      POSTGRES_USER: ${POSTGRES_USER:-sec_llama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sec-llama-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sec_llama}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secllama}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sec-llama-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Web UI Application
  web-ui:
    image: sec-llama/web-ui:latest
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sec_llama}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sec_llama}
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-sec_llama}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sec_llama}

      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secllama}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secllama}

      # Remote LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}

      # LM Studio Configuration (alternative)
      - LM_STUDIO_HOST=${LM_STUDIO_HOST:-http://192.168.1.100:1234}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-local-model}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-not-needed}

      # Application Settings
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEB_UI_PORT=8080

      # CORS Settings
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

      # Rate Limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}

      # Default Admin User
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sec-llama.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

    ports:
      - "${WEB_UI_PORT:-8080}:8080"
    volumes:
      - sec-llama-logs:/app/logs
      - sec-llama-reports:/app/reports
      - sec-llama-database:/app/database
    networks:
      - sec-llama-network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  sec-llama-logs:
    driver: local
  sec-llama-reports:
    driver: local
  sec-llama-database:
    driver: local

networks:
  sec-llama-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
