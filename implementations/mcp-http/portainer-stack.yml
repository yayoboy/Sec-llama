# Portainer Stack File for MCP HTTP
# Copy this content when creating a stack in Portainer

version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sec-llama-mcp-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-server:
    image: sec-llama/mcp-http:latest
    ports:
      - "${MCP_PORT:-8765}:8765"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MCP_API_KEYS=${MCP_API_KEYS}
      - MCP_PORT=8765
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./database:/app/database
    networks:
      - sec-llama-mcp-network
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:

networks:
  sec-llama-mcp-network:
    driver: bridge
